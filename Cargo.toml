[package]
name = "sigmaos-signoff"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "SigmaOS signoff component — Arch Linux package signoff tool (archlinux/arch-signoff inspired)"

[lib]
name = "sigmaos_signoff"
path = "src/lib.rs"

[[bin]]
name = "sigmaos-signoff"
path = "src/main.rs"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "cookies"] }

[dev-dependencies]
tempfile = "3"
